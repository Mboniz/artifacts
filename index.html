<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Artifacts — Marco</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='88'%3E%F0%9F%A5%A6%3C/text%3E%3C/svg%3E">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow">
<meta name="robots" content="noai, noimageai">
<meta name="referrer" content="no-referrer">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e9eaec;
    --surface: #ffffff;
    --ink: #14171d;
    --muted: #6f7480;
    --faint: #a3a6ae;
    --line: #ebecef;
    --hair: #f2f3f6;
    --edge: #d7d8dd;
    --accent: #2d43e0;
    --accent-soft: #eef0fd;
    --live: #12a670;
    --radius: 14px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: 'Space Grotesk', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.5;
    min-height: 100vh;
    padding: clamp(1.5rem, 6vw, 3.25rem) 1rem 3rem;
    display: flex;
    justify-content: center;
  }
  .wrap { width: 100%; max-width: 560px; display: none; }
  body.unlocked .wrap { display: block; }
  body.locked { overflow: hidden; }

  .card {
    background: var(--surface);
    border: 1px solid var(--edge);
    border-radius: var(--radius);
    box-shadow: 0 30px 60px -30px rgba(20,23,29,0.24);
    overflow: hidden;
  }

  /* Header */
  .head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 1rem;
    padding: 1.25rem 1.375rem 1.125rem;
    border-bottom: 1px solid var(--line);
  }
  h1 { font-size: 1.375rem; font-weight: 700; letter-spacing: -0.025em; line-height: 1.1; }
  .origin {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.6875rem;
    color: var(--faint);
    margin-top: 0.3rem;
  }
  .live {
    display: inline-flex; align-items: center; gap: 0.44rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.6875rem;
    color: var(--muted);
    white-space: nowrap;
  }
  .live .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--live);
    animation: pulse 2.4s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(18,166,112,0.45); }
    70% { box-shadow: 0 0 0 7px rgba(18,166,112,0); }
    100% { box-shadow: 0 0 0 0 rgba(18,166,112,0); }
  }

  /* Sections */
  .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.625rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--faint);
    padding: 0.8125rem 1.375rem 0.4375rem;
  }
  .label.gap { padding-top: 1rem; }

  /* Rows */
  a.entry {
    display: grid;
    grid-template-columns: 18px 1fr auto;
    align-items: center;
    gap: 0.75rem;
    padding: 0.5625rem 1.375rem;
    border-top: 1px solid var(--hair);
    text-decoration: none;
    color: inherit;
    transition: background 0.14s ease;
  }
  a.entry:hover { background: var(--accent-soft); }
  a.entry:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .idx {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.625rem;
    color: #b3b6bd;
    text-align: right;
  }
  .idx.app {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--live);
    justify-self: center;
    font-size: 0;
  }
  .body { display: flex; align-items: baseline; gap: 0.5625rem; min-width: 0; }
  .name {
    font-size: 0.9375rem;
    font-weight: 500;
    white-space: nowrap;
    flex-shrink: 0;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .path {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.6875rem;
    color: #b3b6bd;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .arrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    color: #c2c5cc;
    transition: color 0.14s ease, transform 0.14s ease;
  }
  a.entry:hover .arrow { color: var(--accent); transform: translateX(2px); }

  a.entry { opacity: 0; animation: rise 0.35s ease forwards; }
  @keyframes rise { to { opacity: 1; } }

  /* States */
  .state {
    padding: 1.25rem 1.375rem 1.5rem;
    border-top: 1px solid var(--hair);
    font-size: 0.875rem;
    color: var(--muted);
  }
  .retry {
    margin-top: 0.7rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    color: var(--accent);
    background: none; border: 1px solid var(--edge);
    padding: 0.4rem 0.8rem; border-radius: 8px;
    cursor: pointer; transition: background 0.15s;
  }
  .retry:hover { background: var(--accent-soft); }
  .skeleton {
    border-top: 1px solid var(--hair);
    padding: 0.5625rem 1.375rem;
    height: 2.375rem;
  }
  .skeleton span {
    display: block; height: 0.6875rem; width: 45%;
    background: var(--hair); border-radius: 4px;
    margin-top: 0.35rem;
  }

  .foot {
    display: flex; justify-content: space-between; gap: 0.5rem;
    flex-wrap: wrap;
    padding: 0.8125rem 1.375rem;
    border-top: 1px solid var(--line);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.625rem;
    color: var(--faint);
  }
  .foot a { color: var(--muted); text-decoration: none; }
  .foot a:hover { color: var(--accent); }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
    a.entry { opacity: 1 !important; }
  }

  /* Gate */
  #gate {
    position: fixed; inset: 0;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    padding: 1.5rem;
    z-index: 50;
  }
  body.unlocked #gate { display: none; }
  .gate-card { width: 100%; max-width: 20rem; text-align: center; }
  .gate-lock { font-size: 1.75rem; line-height: 1; margin-bottom: 1rem; }
  .gate-card h2 { font-size: 1.375rem; font-weight: 700; letter-spacing: -0.025em; }
  .gate-card p {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.6875rem;
    color: var(--muted);
    margin: 0.35rem 0 1.35rem;
  }
  #pwd {
    width: 100%;
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.125rem;
    letter-spacing: 0.35em;
    text-align: center;
    padding: 0.8rem 0.6rem;
    border: 1px solid var(--edge);
    border-radius: 10px;
    background: var(--surface);
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  #pwd::placeholder { letter-spacing: 0.2em; color: var(--faint); }
  #pwd:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  #gate.error #pwd { border-color: #d93b3b; box-shadow: 0 0 0 3px rgba(217,59,59,0.12); }
  #gate.error .gate-card { animation: shake 0.35s ease; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-7px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(2px); }
  }
  .gate-msg {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.6875rem;
    color: #d93b3b;
    margin-top: 0.8rem;
    min-height: 1rem;
    visibility: hidden;
  }
  #gate.error .gate-msg { visibility: visible; }
  .gate-btn {
    margin-top: 0.9rem;
    width: 100%;
    font-size: 0.9375rem;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    border: none;
    padding: 0.75rem;
    border-radius: 10px;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .gate-btn:hover { opacity: 0.88; }

  @media (max-width: 460px) {
    .body { flex-direction: column; gap: 0.1rem; align-items: flex-start; }
    a.entry { align-items: center; padding-top: 0.6rem; padding-bottom: 0.6rem; }
    .name { white-space: normal; }
  }
</style>
</head>
<body class="locked">
  <div id="gate">
    <div class="gate-card">
      <div class="gate-lock">🔒</div>
      <h2>Artifacts</h2>
      <p>Accesso riservato</p>
      <input id="pwd" type="password" inputmode="numeric" autocomplete="off"
             autocorrect="off" spellcheck="false" maxlength="8" placeholder="••••••••" aria-label="Password">
      <button class="gate-btn" id="gateBtn">Entra</button>
      <div class="gate-msg" id="gateMsg">Accesso negato</div>
    </div>
  </div>

  <div class="wrap">
    <div class="card">
      <div class="head">
        <div>
          <h1>Artifacts</h1>
          <div class="origin">mboniz.github.io / artifacts</div>
        </div>
        <div class="live"><span class="dot"></span><span id="count">—</span></div>
      </div>

      <section id="appsSection" hidden>
        <div class="label">App</div>
        <div id="appsList"></div>
      </section>

      <section>
        <div class="label gap">Pagine statiche</div>
        <div id="list">
          <div class="skeleton"><span></span></div>
          <div class="skeleton"><span></span></div>
          <div class="skeleton"><span></span></div>
        </div>
      </section>

      <div class="foot">
        <span>Aggiornata in tempo reale dal repo</span>
        <a href="https://github.com/Mboniz/artifacts" target="_blank" rel="noopener">Mboniz/artifacts →</a>
      </div>
    </div>
  </div>

<script>
  const EXCLUDE = ['hello'];
  const API = 'https://api.github.com/repos/Mboniz/artifacts/contents/';

  const listEl = document.getElementById('list');
  const countEl = document.getElementById('count');
  const appsSection = document.getElementById('appsSection');
  const appsListEl = document.getElementById('appsList');

  let artifactsCount = 0;
  let appsCount = 0;

  function prettify(slug) {
    return slug.replace(/[-_]/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
  }

  function updateCount() {
    countEl.textContent = (artifactsCount + appsCount) + ' live';
  }

  function row(cls, idxHtml, arrow) {
    const a = document.createElement('a');
    a.className = 'entry';
    a.innerHTML =
      '<span class="idx ' + cls + '">' + idxHtml + '</span>' +
      '<span class="body"><span class="name"></span><span class="path"></span></span>' +
      '<span class="arrow">' + arrow + '</span>';
    return a;
  }

  function render(dirs) {
    if (!dirs.length) {
      listEl.innerHTML = '<div class="state">Ancora niente qui. Pubblica il primo artifact dalla chat e comparirà da solo.</div>';
      artifactsCount = 0;
      updateCount();
      return;
    }
    artifactsCount = dirs.length;
    updateCount();
    listEl.innerHTML = '';
    dirs.forEach((slug, i) => {
      const a = row('', String(i + 1).padStart(2, '0'), '→');
      a.href = slug + '/';
      a.style.animationDelay = (i * 40) + 'ms';
      a.querySelector('.name').textContent = prettify(slug);
      a.querySelector('.path').textContent = '/' + slug + '/';
      listEl.appendChild(a);
      upgradeTitle(slug, a.querySelector('.name'));
    });
  }

  async function upgradeTitle(slug, nameEl) {
    try {
      const res = await fetch(slug + '/', { cache: 'no-store' });
      if (!res.ok) return;
      const html = await res.text();
      const doc = new DOMParser().parseFromString(html, 'text/html');
      const t = doc.querySelector('title');
      if (t && t.textContent.trim()) {
        const clean = t.textContent.trim().split(/\s[—|·]\s/)[0].trim();
        if (clean) nameEl.textContent = clean;
      }
    } catch (e) {}
  }

  function showError(rateLimited) {
    countEl.textContent = '—';
    listEl.innerHTML =
      '<div class="state">' +
      (rateLimited
        ? 'GitHub ha temporaneamente limitato le richieste (troppi refresh ravvicinati). Riprova tra un minuto.'
        : 'Non riesco a leggere la lista dal repo in questo momento.') +
      '<br><button class="retry" onclick="load()">Riprova</button></div>';
  }

  async function loadApps() {
    try {
      const res = await fetch('apps.json', { cache: 'no-store' });
      if (!res.ok) return;
      const apps = await res.json();
      if (!Array.isArray(apps) || !apps.length) return;
      appsCount = apps.length;
      appsListEl.innerHTML = '';
      apps.forEach((app, i) => {
        if (!app || !app.url || !app.name) return;
        const a = row('app', '', '↗');
        a.href = app.url;
        a.target = '_blank';
        a.rel = 'noopener';
        a.style.animationDelay = (i * 40) + 'ms';
        a.title = app.description || '';
        a.querySelector('.name').textContent = app.name;
        a.querySelector('.path').textContent = String(app.url).replace(/^https?:\/\//, '').replace(/\/$/, '');
        appsListEl.appendChild(a);
      });
      appsSection.hidden = false;
      updateCount();
    } catch (e) {}
  }

  async function load() {
    listEl.innerHTML = '<div class="skeleton"><span></span></div><div class="skeleton"><span></span></div><div class="skeleton"><span></span></div>';
    loadApps();
    try {
      const res = await fetch(API, { headers: { 'Accept': 'application/vnd.github+json' }, cache: 'no-store' });
      if (res.status === 403) { showError(true); return; }
      if (!res.ok) { showError(false); return; }
      const data = await res.json();
      const dirs = data
        .filter(x => x.type === 'dir' && !EXCLUDE.includes(x.name))
        .map(x => x.name)
        .sort((a, b) => a.localeCompare(b));
      render(dirs);
    } catch (e) {
      showError(false);
    }
  }

  /* ---- Gate ---- */
  const gate = document.getElementById('gate');
  const pwd = document.getElementById('pwd');
  const KEY = '_ax';

  function k() {
    const d = new Date();
    return String(d.getDate()).padStart(2, '0')
         + String(d.getMonth() + 1).padStart(2, '0')
         + d.getFullYear();
  }

  function unlock() {
    document.body.classList.remove('locked');
    document.body.classList.add('unlocked');
    try { localStorage.setItem(KEY, k()); } catch (e) {}
    load();
  }

  function attempt() {
    if (pwd.value.trim() === k()) {
      unlock();
    } else {
      gate.classList.add('error');
      pwd.value = '';
      pwd.focus();
      setTimeout(() => gate.classList.remove('error'), 2500);
    }
  }

  document.getElementById('gateBtn').addEventListener('click', attempt);
  pwd.addEventListener('keydown', e => { if (e.key === 'Enter') attempt(); });
  pwd.addEventListener('input', () => gate.classList.remove('error'));

  let saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}
  if (saved === k()) { unlock(); } else { pwd.focus(); }
</script>
</body>
</html>
