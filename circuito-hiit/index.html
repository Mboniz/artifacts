1111",sub:"#6e6e73",faint:"#a1a1a6",line:"#e5e5ea",soft:"#f5f5f7",accent:"#ff5a1f"},ji="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Helvetica Neue', Arial, sans-serif",vr=[{id:"w1",name:"Marcia sul posto",presc:"1'",secs:60,why:"Alza FC e temperatura, sveglia le caviglie.",desc:`In piedi, marcia sul posto portando le ginocchia all'altezza dell'anca. Le braccia oscillano ampie in opposizione alle gambe, come nella corsa. Appoggio morbido sull'avampiede e poi su tutto il piede. Nei primi 30" ritmo tranquillo, negli ultimi 30" accelera un po' la cadenza: alla fine il respiro deve essere leggermente pi\xF9 veloce.`},{id:"w2",name:"Rotazioni braccia",presc:'30"',secs:30,why:"Prepara le spalle a push-up, rematore e swing.",desc:`Braccia tese di lato. 15" di cerchi in avanti partendo piccoli e allargandoli fino a cerchi completi, poi 15" all'indietro allo stesso modo. Spalle basse, lontane dalle orecchie, addome contratto.`},{id:"w3",name:"Hip hinge",presc:"10",why:"Insegna il movimento dello swing e scalda gli ischiocrurali.",desc:"Piedi alla larghezza delle anche, ginocchia appena piegate, mani sui fianchi. Spingi il bacino indietro come per chiudere una porta col sedere, il busto si inclina in avanti con la schiena dritta. Scendi finch\xE9 senti tirare dietro le cosce, poi torna su contraendo i glutei. Le ginocchia restano ferme: si muovono solo le anche. Ritmo lento, 2 secondi gi\xF9 e 1 su."},{id:"w4",name:"Ponte glutei",presc:"10",why:"Attiva i glutei, il motore di swing e affondi.",desc:"Sdraiato sulla schiena, ginocchia piegate, piedi a terra alla larghezza delle anche, talloni vicini al sedere. Spingi con i talloni e solleva il bacino fino a una linea dritta spalle-ginocchia. In cima tieni 2 secondi stringendo i glutei, senza inarcare la schiena. Scendi lento."},{id:"w5",name:"Squat a corpo libero",presc:"10",why:"Mobilizza anche, ginocchia e caviglie per il goblet squat.",desc:"Piedi alla larghezza delle spalle, punte aperte di 30\xB0, braccia tese davanti per bilanciare. Scendi lento fino a dove la schiena resta dritta e i talloni a terra, ginocchia in linea con le punte. Nelle prime ripetizioni scendi a met\xE0, poi sempre pi\xF9 in basso. Risali spingendo con tutto il piede."},{id:"w6",name:"Affondi indietro lenti",presc:"5 + 5",why:"Prova il movimento degli affondi e scalda il gluteo.",desc:"In piedi, mani sui fianchi. Passo lungo indietro con il destro, scendi lento finch\xE9 il ginocchio dietro sfiora terra, peso sul tallone della gamba davanti. Torna su spingendo con la gamba davanti. 5 ripetizioni per lato alternando, senza fretta: qui conta la tecnica, l'intensit\xE0 arriva nel circuito."}],$n=[{id:"e1",name:"KB swing",load:"16 kg",cue:"Spinta di anche, braccia passive, KB all'altezza del petto.",desc:"Piedi poco oltre la larghezza delle spalle, KB a terra 30 cm davanti. Afferra il manico, carica le anche indietro come per chiudere una porta col sedere, schiena neutra. Lancia la KB indietro tra le gambe, poi estendi le anche con forza: glutei che si contraggono, ginocchia distese, busto verticale. La KB sale fino al petto per inerzia, le braccia la guidano e basta. Lascia che ricada e riassorbi il movimento caricando di nuovo le anche. Ritmo costante, respiro espulso a ogni spinta. Talloni sempre a terra."},{id:"e2",name:"Goblet squat",load:"16 kg",cue:"Busto verticale, sotto il parallelo, talloni a terra.",desc:"KB tenuta per il campanello al petto, gomiti stretti. Piedi alla larghezza delle spalle, punte aperte di 30\xB0. Scendi controllando in 2 secondi fino a portare l'anca sotto il ginocchio, ginocchia che seguono le punte. Risali spingendo il pavimento con tutto il piede. In cima ginocchia distese senza bloccarle. Il ritmo \xE8 quello di un circuito ma la discesa resta controllata."},{id:"e3",name:"Push-up",load:"Corpo libero",cue:"Corpo in linea, petto a un pugno da terra.",desc:"Mani poco oltre la larghezza delle spalle, corpo una linea dritta dalle spalle ai talloni, addome e glutei contratti. Scendi con i gomiti a 45\xB0 dal busto fino a portare il petto a un pugno da terra, poi spingi. Quando la linea del corpo cede, continua con le mani su un rialzo (divano, sedia, gradino): stesso movimento, meno carico. La qualit\xE0 di ogni ripetizione conta pi\xF9 del numero."},{id:"e4",name:"Affondi indietro alternati",load:"Manubri 3 kg",cue:"Passo lungo indietro, ginocchio dietro sfiora terra.",desc:"In piedi, un manubrio da 3 kg per mano lungo i fianchi. Fai un passo lungo indietro con il piede destro e scendi finch\xE9 il ginocchio destro sfiora il pavimento; la tibia davanti resta quasi verticale e il peso sul tallone anteriore. Spingi con la gamba davanti per tornare in piedi e alterna. L'affondo indietro carica la gamba anteriore sul tallone: il polpaccio lavora poco e il gluteo molto."},{id:"e5",name:"Rematore KB, un braccio",load:"16 kg",cue:'Giro 1 destro \xB7 giro 2 sinistro \xB7 giro 3 20" + 20".',desc:`Mano libera appoggiata su una sedia o sul ginocchio, busto inclinato quasi parallelo al pavimento, schiena neutra. KB nella mano opposta, braccio disteso. Tira la KB verso l'anca portando il gomito indietro e vicino al fianco, scapola che si avvicina alla colonna. Scendi controllando. Giro 1 braccio destro, giro 2 braccio sinistro, giro 3 20" per braccio.`},{id:"e6",name:"Burpee a passi",load:"Corpo libero",cue:"Mani a terra, passo indietro, passo avanti, in piedi.",desc:"Da in piedi, accovacciati e appoggia le mani a terra. Porta indietro un piede e poi l'altro fino alla posizione di plank. Riporta avanti un piede e poi l'altro, torna in piedi ed estendi le anche portando le braccia sopra la testa. Ritmo sostenuto: \xE8 l'esercizio che porta la FC in alto. Ogni appoggio \xE8 un passo, i piedi passano sempre uno alla volta."}],dr=[{id:"c1",name:"Plank sui gomiti",secs:45},{id:"c2",name:"Side plank destro",secs:30},{id:"c3",name:"Side plank sinistro",secs:30}],mr=["Ogni esercizio ha un appoggio a terra continuo: il carico sul tendine d'Achille res
