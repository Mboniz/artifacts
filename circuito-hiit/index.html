<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

// ── Parametri del circuito ─────────────────────────────────────────────
const WORK = 40;        // secondi di lavoro
const REST = 20;        // secondi di pausa tra esercizi
const ROUND_REST = 60;  // secondi tra un giro e l'altro
const ROUNDS = 3;

// ── Stile ──────────────────────────────────────────────────────────────
const C = {
  bg: "#ffffff",
  ink: "#111111",
  sub: "#6e6e73",
  faint: "#a1a1a6",
  line: "#e5e5ea",

  accent: "#ff5a1f",

const FONT = "-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Helvetica Neue', Arial, sans-serif";

// ── Contenuti ──────────────────────────────────────────────────────────

  { id: "e5", name: "Rematore KB, un braccio", load: "16 kg",
    cue: "Giro 1 destro · giro 2 sinistro · giro 3 20\" + 20\".",
    desc: "Mano libera appoggiata su una sedia o sul ginocchio, busto inclinato quasi parallelo al pavimento, schiena neutra. KB nella mano opposta, braccio disteso. Tira la KB verso l'anca portando il gomito indietro e vicino al fianco, scapola che si avvicina alla colonna. Scendi controllando. Giro 1 braccio destro, giro 2 braccio sinistro, giro 3 20\" per braccio." },

const CORE = [
  { id: "c1", name: "Dead bug", presc: "2 × 8 per lato",
    why: "Anti-estensione con braccia e gambe in movimento.",
    desc: "Sdraiato sulla schiena, braccia tese verso il soffitto, ginocchia piegate a 90° con le cosce perpendicolari al pavimento. Costole basse e zona lombare appoggiata, senza schiacciarla. Espira a fondo mentre allunghi lentamente un braccio dietro la testa e la gamba opposta verso il pavimento, senza toccarlo. Torna al centro e alterna. Se la schiena si stacca da terra, riduci l'ampiezza." },
  { id: "c2", name: "Suitcase march, KB a destra", presc: "40\"", secs: 40,
    why: "Anti-inclinazione laterale in appoggio su una gamba.",
    desc: "KB da 16 kg nella mano destra, braccio disteso lungo il fianco, spalle alla stessa altezza, busto dritto. Marcia lenta sul posto: sollevi un ginocchio fino all'altezza dell'anca, tieni un secondo, riappoggi, poi l'altro. Il peso tira da un lato: il lavoro sta nel non inclinarti e nel tenere il bacino in piano." },
  { id: "c3", name: "Suitcase march, KB a sinistra", presc: "40\"", secs: 40,
    why: "Stesso lavoro sul lato opposto.",
    desc: "Identico al precedente con la KB nella mano sinistra." },
  { id: "c4", name: "Side plank destro", presc: "20\"", secs: 20,
    why: "Contrazione massima, non tempo lungo.",
    desc: "Sul gomito destro, gomito sotto la spalla, piedi sovrapposti o sfalsati. Solleva il bacino fino a una linea dritta da testa a piedi e stringi glutei e addome al massimo per tutti i 20\"." },
  { id: "c5", name: "Side plank sinistro", presc: "20\"", secs: 20,
    why: "Contrazione massima, non tempo lungo.",
    desc: "Identico al precedente sul gomito sinistro." },
];

const NOTES = [
  "Ogni esercizio ha un appoggio a terra continuo: il carico sul tendine d'Achille resta basso anche ad alta intensità.",
  "Intensità RPE 7–8, FC in Z3–Z4 (136–174). Il picco di FC arriva sullo swing. Ultimo giro duro ma tecnicamente pulito.",
  "Se la forma cede (bacino che oscilla negli up-down, linea del corpo che si rompe nei push-up, busto che si inclina nella suitcase march), la serie si ferma anche se il timer corre.",
  "Push-up, up-down e side plank caricano tutti spalle e polsi: se nell'ultimo giro le spalle cedono, negli up-down resta in plank sui gomiti.",
  "Collocazione: nello stesso giorno di una seduta dura in bici, oppure al mattino di un giorno senza corsa.",
  "Progressione: settimana 1 40\"/20\" · settimana 2 45\"/15\" · settimana 3 4 giri a 40\"/20\".",
];

// ── Utilità ────────────────────────────────────────────────────────────
function beep(freq = 880, dur = 0.25) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = freq; o.type = "sine";
    g.gain.setValueAtTime(0.0001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.3, ctx.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
    o.start(); o.stop(ctx.currentTime + dur);
  } catch (e) {}
}

const fmt = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
const fmtShort = s => (s >= 60 ? fmt(s) : `${s}"`);

function buildPhases() {
  const phases = [];
  for (let r = 1; r <= ROUNDS; r++) {
    EXERCISES.forEach((ex, i) => {
      phases.push({ type: "work", round: r, ex, n: i + 1, secs: WORK });
      if (i < EXERCISES.length - 1) phases.push({ type: "rest", round: r, next: EXERCISES[i + 1], secs: REST });
      else if (r < ROUNDS) phases.push({ type: "roundRest", round: r, next: EXERCISES[0], secs: ROUND_REST });
    });
  }
  return phases;
}
const PHASES = buildPhases();
const TOTAL_SECS = PHASES.reduce((a, p) => a + p.secs, 0);

// ── Elementi base ──────────────────────────────────────────────────────
const label = { fontSize: 13, fontWeight: 600, color: C.sub, letterSpacing: 0.2 };
const h2 = { fontSize: 28, fontWeight: 700, color: C.ink, letterSpacing: -0.6, margin: 0 };

function Section({ title, meta, children }) {
  return (
    <section style={{ marginTop: 56 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 8 }}>
        <h2 style={h2}>{title}</h2>
        {meta && <span style={label}>{meta}</span>}
      </div>
      {children}
    </section>
  );
}

function TextButton({ children, onClick, strong }) {
  return (
    <button onClick={onClick}
      style={{ background: "none", border: "none", padding: 0, fontFamily: FONT, fontSize: 15,
        fontWeight: strong ? 600 : 500, color: strong ? C.accent : C.sub, cursor: "pointer" }}>
      {children}
    </button>
  );
}

function Check({ on }) {
  return (
    <span style={{ width: 22, height: 22, borderRadius: 11, flexShrink: 0, marginTop: 2,
      border: on ? "none" : `1.5px solid ${C.faint}`, background: on ? C.accent : "transparent",
      display: "inline-flex", alignItems: "center", justifyContent: "center", color: "#fff", fontSize: 12, fontWeight: 700 }}>
      {on ? "✓" : ""}
    </span>
  );
}

function MiniTimer({ seconds }) {
  const [left, setLeft] = useState(seconds);
  const [running, setRunning] = useState(false);
  useEffect(() => {
    if (!running) return;
    const id = setInterval(() => setLeft(p => (p > 0 ? p - 1 : 0)), 1000);
    return () => clearInterval(id);
  }, [running]);
  useEffect(() => { if (left === 0 && running) { setRunning(false); beep(); } }, [left, running]);
  const done = left === 0;
  return (
    <button onClick={e => { e.stopPropagation(); if (done) setLeft(seconds); else setRunning(!running); }}
      style={{ background: "none", border: "none", padding: 0, fontFamily: FONT, cursor: "pointer",
        fontSize: 15, fontWeight: 600, fontVariantNumeric: "tabular-nums",
        color: running ? C.accent : done ? C.sub : C.ink }}>
      {done ? "Rifai" : running ? fmtShort(left) : `Avvia ${fmtShort(left)}`}
    </button>
  );
}

function Row({ title, right, sub, checked, onToggle, children }) {
  return (
    <div onClick={onToggle}
      style={{ display: "flex", gap: 14, padding: "18px 0", borderBottom: `1px solid ${C.line}`,
        cursor: onToggle ? "pointer" : "default" }}>
      {onToggle && <Check on={checked} />}
      <div style={{ flex: 1, minWidth: 0, opacity: checked ? 0.4 : 1 }}>
        <div style={{ display: "flex", justifyContent: "space-between", gap: 12, alignItems: "baseline" }}>
          <span style={{ fontSize: 17, fontWeight: 600, color: C.ink }}>{title}</span>
          <span style={{ fontSize: 15, fontWeight: 500, color: C.sub, whiteSpace: "nowrap", fontVariantNumeric: "tabular-nums" }}>{right}</span>
        </div>
        {sub && <div style={{ fontSize: 15, color: C.sub, marginTop: 4, lineHeight: 1.45 }}>{sub}</div>}
        {children}
      </div>
    </div>
  );
}

function Details({ text, extra }) {
  const [open, setOpen] = useState(false);
  return (
    <div onClick={e => e.stopPropagation()}>
      <div style={{ display: "flex", gap: 20, marginTop: 10, alignItems: "center" }}>
        <TextButton onClick={() => setOpen(!open)}>{open ? "Chiudi" : "Come si esegue"}</TextButton>
        {extra}
      </div>
      {open && <p style={{ fontSize: 15, color: C.ink, lineHeight: 1.6, margin: "10px 0 0" }}>{text}</p>}
    </div>
  );
}

// ── Timer guidato ──────────────────────────────────────────────────────
function CircuitTimer() {
  const [st, setSt] = useState({ idx: 0, left: PHASES[0].secs, finished: false });
  const [running, setRunning] = useState(false);
  const { idx, left, finished } = st;

  useEffect(() => {
    if (!running) return;
    const id = setInterval(() => {
      setSt(s => {
        if (s.finished) return s;
        if (s.left > 1) return { ...s, left: s.left - 1 };
        if (s.idx + 1 >= PHASES.length) return { ...s, left: 0, finished: true };
        return { idx: s.idx + 1, left: PHASES[s.idx + 1].secs, finished: false };
      });
    }, 1000);
    return () => clearInterval(id);
  }, [running]);

  const prev = useRef(st);
  useEffect(() => {
    const p = prev.current; prev.current = st;
    if (!running && !st.finished) return;
    if (st.finished && !p.finished) { beep(990, 0.8); setRunning(false); return; }
    if (st.idx !== p.idx) beep(PHASES[st.idx].type === "work" ? 990 : 520, 0.4);
    else if (st.left <= 3 && st.left > 0 && st.left !== p.left) beep(660, 0.12);
  }, [st, running]);

  const reset = () => { setRunning(false); setSt({ idx: 0, left: PHASES[0].secs, finished: false }); };
  const skip = () => setSt(s => s.idx + 1 >= PHASES.length
    ? { ...s, left: 0, finished: true }
    : { idx: s.idx + 1, left: PHASES[s.idx + 1].secs, finished: false });

  const ph = PHASES[idx];
  const isWork = ph.type === "work";
  const elapsed = PHASES.slice(0, idx).reduce((a, p) => a + p.secs, 0) + (ph.secs - left);
  const phasePct = ((ph.secs - left) / ph.secs) * 100;
  const started = running || idx > 0 || left !== PHASES[0].secs;

  if (finished) {
    return (
      <div style={{ padding: "48px 0", borderTop: `1px solid ${C.line}`, borderBottom: `1px solid ${C.line}` }}>
        <div style={{ fontSize: 40, fontWeight: 700, color: C.ink, letterSpacing: -1 }}>Fatto.</div>
        <div style={{ fontSize: 17, color: C.sub, marginTop: 8 }}>Ora il core, poi due minuti di camminata.</div>
        <div style={{ marginTop: 24 }}><TextButton strong onClick={reset}>Ricomincia</TextButton></div>
      </div>
    );
  }

  return (
    <div style={{ paddingTop: 8 }}>
      <div style={label}>
        Giro {ph.round} di {ROUNDS} — {isWork ? "Lavoro" : ph.type === "roundRest" ? "Pausa tra i giri" : "Pausa"}
      </div>

      <div style={{ marginTop: 20, minHeight: 96 }}>
        <div style={{ fontSize: 34, fontWeight: 700, color: isWork ? C.ink : C.faint, letterSpacing: -0.8, lineHeight: 1.1 }}>
          {isWork ? ph.ex.name : "Respira"}
        </div>
        <div style={{ fontSize: 17, color: C.sub, marginTop: 6, lineHeight: 1.4 }}>
          {isWork ? `${ph.ex.load} · ${ph.ex.cue}` : `Poi: ${ph.next.name}, ${ph.next.load.toLowerCase()}`}
        </div>
      </div>

      <div style={{ fontSize: 120, fontWeight: 200, color: isWork ? C.ink : C.faint, letterSpacing: -4,
        fontVariantNumeric: "tabular-nums", lineHeight: 1, margin: "28px 0 24px", textAlign: "center" }}>
        {left}
      </div>

      <div style={{ height: 2, background: C.line }}>
        <div style={{ height: 2, width: `${phasePct}%`, background: isWork ? C.accent : C.faint, transition: "width 1s linear" }} />
      </div>

      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 20 }}>
        <button onClick={() => setRunning(!running)}
          style={{ background: running ? C.soft : C.accent, color: running ? C.ink : "#fff", border: "none",
            borderRadius: 999, padding: "14px 32px", fontFamily: FONT, fontSize: 17, fontWeight: 600, cursor: "pointer" }}>
          {running ? "Pausa" : started ? "Riprendi" : "Inizia"}
        </button>
        <div style={{ display: "flex", gap: 24 }}>
          <TextButton onClick={skip}>Salta</TextButton>
          <TextButton onClick={reset}>Azzera</TextButton>
        </div>
      </div>

      <div style={{ ...label, marginTop: 20, fontWeight: 500, fontVariantNumeric: "tabular-nums" }}>
        {fmt(elapsed)} di {fmt(TOTAL_SECS)}
      </div>
    </div>
  );
}

// ── Pagina ─────────────────────────────────────────────────────────────
function CircuitoHIIT() {
  const [checks, setChecks] = useState({});
  const toggle = id => setChecks(p => ({ ...p, [id]: !p[id] }));

  return (
    <div style={{ minHeight: "100vh", background: C.bg, fontFamily: FONT, WebkitFontSmoothing: "antialiased" }}>
      <div style={{ maxWidth: 560, margin: "0 auto", padding: "48px 20px 64px" }}>

        <header>
          <div style={label}>Forza</div>
          <h1 style={{ fontSize: 44, fontWeight: 700, color: C.ink, letterSpacing: -1.4, margin: "6px 0 0", lineHeight: 1.05 }}>
            Circuito HIIT
          </h1>
          <p style={{ fontSize: 19, color: C.sub, margin: "12px 0 0", lineHeight: 1.4 }}>
            27 minuti. Riscaldamento, tre giri da sei esercizi, core.
          </p>
          <div style={{ display: "flex", gap: 28, marginTop: 28 }}>
            {[["40\" / 20\"", "lavoro / pausa"], ["RPE 7–8", "intensità"], ["Z3–Z4", "frequenza"]].map(([v, l]) => (
              <div key={l}>
                <div style={{ fontSize: 20, fontWeight: 600, color: C.ink }}>{v}</div>
                <div style={{ fontSize: 13, color: C.sub, marginTop: 2 }}>{l}</div>
              </div>
            ))}
          </div>
        </header>

        <Section title="Riscaldamento" meta="4 minuti">
          <p style={{ fontSize: 17, color: C.sub, lineHeight: 1.5, margin: "4px 0 8px" }}>
            Sei movimenti in sequenza, senza pause, ritmo tranquillo. Preparano gli stessi gesti del circuito:
            alla fine sei caldo, con il respiro appena più veloce e le anche sciolte.
          </p>
          {WARMUP.map(w => (
            <Row key={w.id} title={w.name} right={w.presc} sub={w.why} checked={!!checks[w.id]} onToggle={() => toggle(w.id)}>
              <Details text={w.desc} extra={w.secs && !checks[w.id] ? <MiniTimer seconds={w.secs} /> : null} />
            </Row>
          ))}
        </Section>

        <Section title="Circuito" meta={`${Math.round(TOTAL_SECS / 60)} minuti`}>
          <CircuitTimer />
        </Section>

        <Section title="Esercizi" meta="Stesso ordine in ogni giro">
          {EXERCISES.map((ex, i) => (
            <Row key={ex.id} title={`${i + 1}. ${ex.name}`} right={ex.load} sub={ex.cue}>
              <Details text={ex.desc} />
            </Row>
          ))}
        </Section>

        <Section title="Core" meta="4 minuti">
          {CORE.map(c => (
            <Row key={c.id} title={c.name} right={c.presc} sub={c.why} checked={!!checks[c.id]} onToggle={() => toggle(c.id)}>
              <Details text={c.desc} extra={c.secs && !checks[c.id] ? <MiniTimer seconds={c.secs} /> : null} />
            </Row>
          ))}
        </Section>

        <Section title="Note">
          {NOTES.map((n, i) => (
            <p key={i} style={{ fontSize: 15, color: C.sub, lineHeight: 1.55, margin: "12px 0 0" }}>{n}</p>
          ))}
        </Section>

        <div style={{ marginTop: 48, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <TextButton onClick={() => setChecks({})}>Azzera le spunte</TextButton>
          <span style={{ fontSize: 13, color: C.faint }}>Coach AI</span>

  );
}
